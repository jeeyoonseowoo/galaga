<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>GALAGA</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05060f;
    color: #e6e9f5;
    font-family: "Consolas", "Courier New", monospace;
    height: 100%;
    overflow: hidden;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 10px;
  }
  canvas {
    background: #05060f;
    border: 2px solid #2a3157;
    box-shadow: 0 0 30px rgba(80,120,255,0.25);
    image-rendering: pixelated;
    max-height: 92vh;
  }
  #hint {
    font-size: 12px;
    color: #6d78a8;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="640" height="720"></canvas>
  <div id="hint">← → 이동 &nbsp;|&nbsp; SPACE 발사 &nbsp;|&nbsp; P 일시정지 &nbsp;|&nbsp; M 음소거 &nbsp;|&nbsp; 🪙 코코인 = 총알 2배 + 함선 강화</div>
</div>
<script>
(function () {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;

/* ------------------------------------------------------------------ */
/* Audio (Web Audio API)                                               */
/* ------------------------------------------------------------------ */
const Sound = {
  ctx: null,
  muted: false,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },
  tone(freq, dur, type, vol, freqEnd) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type || "square";
    osc.frequency.setValueAtTime(freq, t);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t + dur);
    gain.gain.setValueAtTime(vol || 0.08, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  },
  noise(dur, vol) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol || 0.2, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const filt = this.ctx.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.setValueAtTime(1800, t);
    src.connect(filt).connect(gain).connect(this.ctx.destination);
    src.start(t);
  },
  shoot()      { this.tone(880, 0.10, "square",   0.05, 220); },
  enemyShoot() { this.tone(320, 0.14, "sawtooth", 0.04, 120); },
  hit()        { this.noise(0.18, 0.18); this.tone(180, 0.12, "square", 0.05, 60); },
  playerDie()  { this.noise(0.5, 0.28);  this.tone(220, 0.6,  "sawtooth", 0.10, 40); },
  stage()      { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.14, "square", 0.07), i * 110)); },
  gameOver()   { [440, 349, 262, 175].forEach((f, i) => setTimeout(() => this.tone(f, 0.3, "triangle", 0.09), i * 200)); },
  extraLife()  { [784, 1047, 1319].forEach((f, i) => setTimeout(() => this.tone(f, 0.12, "square", 0.07), i * 90)); },
  coin()       { [1319, 1760].forEach((f, i) => setTimeout(() => this.tone(f, 0.10, "square", 0.06), i * 70)); },
  powerUp()    { [523, 784, 1047, 1568].forEach((f, i) => setTimeout(() => this.tone(f, 0.16, "square", 0.08), i * 80)); },
  powerDown()  { this.tone(500, 0.35, "sawtooth", 0.07, 90); }
};

/* ------------------------------------------------------------------ */
/* Input                                                               */
/* ------------------------------------------------------------------ */
const keys = Object.create(null);
window.addEventListener("keydown", (e) => {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) keys[e.code + "_pressed"] = true;
  keys[e.code] = true;
  Sound.init();

  if (e.code === "KeyM") {
    Sound.muted = !Sound.muted;
  }
  if (e.code === "KeyP" && game.state === "playing") {
    game.paused = !game.paused;
  }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });
canvas.addEventListener("mousedown", () => Sound.init());

/* ------------------------------------------------------------------ */
/* Helpers                                                             */
/* ------------------------------------------------------------------ */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
function overlap(a, b) {
  return a.x - a.w / 2 < b.x + b.w / 2 &&
         a.x + a.w / 2 > b.x - b.w / 2 &&
         a.y - a.h / 2 < b.y + b.h / 2 &&
         a.y + a.h / 2 > b.y - b.h / 2;
}

/* ------------------------------------------------------------------ */
/* Enemy types                                                         */
/* ------------------------------------------------------------------ */
const ENEMY_TYPES = {
  grunt:   { score: 50,  hp: 1, color: "#5ad2ff", accent: "#1b6fa8", w: 30, h: 24, fireRate: 0.5 },
  soldier: { score: 100, hp: 1, color: "#ff5ec4", accent: "#8a2168", w: 32, h: 26, fireRate: 0.9 },
  boss:    { score: 200, hp: 2, color: "#ffd35a", accent: "#a97a10", w: 36, h: 28, fireRate: 1.3 }
};

/* ------------------------------------------------------------------ */
/* Ship power levels — collect 코코인 to level up                       */
/* ------------------------------------------------------------------ */
const MAX_POWER = 4;
const SHIP_TIERS = [
  { name: "FIGHTER",     scale: 1.00, shots: 1, hull: "#e8f4ff", trim: "#3aa0ff", glow: null },
  { name: "TWIN BLADE",  scale: 1.18, shots: 2, hull: "#dff0ff", trim: "#39d7ff", glow: "rgba(90,210,255,0.30)" },
  { name: "DESTROYER",   scale: 1.36, shots: 3, hull: "#fff0d8", trim: "#ffb43a", glow: "rgba(255,180,60,0.32)" },
  { name: "OMEGA WING",  scale: 1.55, shots: 4, hull: "#ffe6ff", trim: "#ff5ec4", glow: "rgba(255,94,196,0.38)" }
];

/* ------------------------------------------------------------------ */
/* Game state                                                          */
/* ------------------------------------------------------------------ */
const game = {
  state: "title",       // title | playing | stageclear | dying | gameover
  paused: false,
  score: 0,
  hiScore: 0,
  lives: 3,
  stage: 1,
  power: 1,             // 1..MAX_POWER
  nextExtra: 20000,
  coinTimer: 8,
  timer: 0,
  shake: 0
};

let player, bullets, enemyBullets, enemies, particles, stars, coins;
let formation;  // formation sway state

/* ------------------------------------------------------------------ */
/* Starfield                                                           */
/* ------------------------------------------------------------------ */
function makeStars() {
  stars = [];
  for (let i = 0; i < 110; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      s: rand(0.4, 1.8),
      v: rand(18, 90)
    });
  }
}

function updateStars(dt) {
  for (const st of stars) {
    st.y += st.v * dt;
    if (st.y > H) { st.y = -2; st.x = Math.random() * W; }
  }
}

function drawStars() {
  for (const st of stars) {
    const a = clamp(st.v / 100, 0.2, 0.9);
    ctx.fillStyle = "rgba(255,255,255," + a.toFixed(2) + ")";
    ctx.fillRect(st.x, st.y, st.s, st.s);
  }
}

/* ------------------------------------------------------------------ */
/* Setup                                                               */
/* ------------------------------------------------------------------ */
function resetPlayer() {
  player = {
    x: W / 2, y: H - 60,
    // hitbox stays forgiving even when the hull grows
    w: 26, h: 22,
    speed: 320,
    cooldown: 0,
    invuln: 2.0,
    alive: true
  };
}

function newGame() {
  game.score = 0;
  game.lives = 3;
  game.stage = 1;
  game.power = 1;
  game.nextExtra = 20000;
  game.coinTimer = rand(6, 11);
  game.paused = false;
  bullets = [];
  enemyBullets = [];
  particles = [];
  coins = [];
  resetPlayer();
  buildStage(1);
  game.state = "playing";
}

function buildStage(stage) {
  enemies = [];
  bullets = [];
  enemyBullets = [];
  coins = [];

  const rows = Math.min(3 + Math.floor((stage - 1) / 2), 6);
  const cols = Math.min(6 + Math.floor((stage - 1) / 3), 10);
  const spacingX = 46;
  const spacingY = 44;
  const startX = W / 2 - (cols - 1) * spacingX / 2;
  const startY = 90;

  for (let r = 0; r < rows; r++) {
    let type;
    if (r === 0) type = "boss";
    else if (r <= 2) type = "soldier";
    else type = "grunt";

    for (let c = 0; c < cols; c++) {
      const def = ENEMY_TYPES[type];
      const hx = startX + c * spacingX;
      const hy = startY + r * spacingY;
      enemies.push({
        type: type,
        hp: def.hp,
        w: def.w, h: def.h,
        homeX: hx, homeY: hy,
        x: hx + rand(-260, 260),
        y: hy - rand(240, 520),
        entering: true,
        enterDelay: (r * cols + c) * 0.045,
        diving: false,
        diveT: 0,
        diveDir: 1,
        fireCd: rand(1.5, 6),
        anim: Math.random() * Math.PI * 2
      });
    }
  }

  formation = {
    offX: 0,
    dir: 1,
    speed: 26 + (stage - 1) * 7,
    range: 34,
    dropped: 0,
    diveTimer: rand(2.5, 4.5)
  };

  game.stageBanner = 2.0;
  game.stageEnemyCount = enemies.length;
}

/* ------------------------------------------------------------------ */
/* Particles                                                           */
/* ------------------------------------------------------------------ */
function explode(x, y, color, count, power) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(40, 260) * (power || 1);
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: rand(0.3, 0.8),
      maxLife: 0.8,
      color: color,
      size: rand(1.5, 3.5)
    });
  }
}

function addFloatText(x, y, text, color) {
  particles.push({ text: text, x: x, y: y, vx: 0, vy: -34, life: 0.9, maxLife: 0.9, color: color, size: 12 });
}

/* ------------------------------------------------------------------ */
/* Drawing: ships                                                      */
/* ------------------------------------------------------------------ */
// Draws the hull at the given power level (1..4), centred on the origin,
// already scaled. Shared by the in-game ship and the title-screen preview.
function drawShipHull(level, t) {
  const tier = SHIP_TIERS[level - 1];

  // ambient glow from tier 2 up
  if (tier.glow) {
    const pulse = 0.75 + Math.sin(t * 5) * 0.25;
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 30 * pulse);
    g.addColorStop(0, tier.glow);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
  }

  // engine flames — one nozzle at Lv1-2, three at Lv3+
  const f = 4 + Math.sin(t * 30) * 2;
  const nozzles = level >= 3 ? [-8, 0, 8] : [0];
  for (const nx of nozzles) {
    const len = nx === 0 ? f + (level - 1) * 2 : f * 0.7;
    ctx.fillStyle = "rgba(255,160,40,0.9)";
    ctx.beginPath();
    ctx.moveTo(nx - 3.5, 13); ctx.lineTo(nx, 13 + len); ctx.lineTo(nx + 3.5, 13);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,180,0.85)";
    ctx.beginPath();
    ctx.moveTo(nx - 1.5, 13); ctx.lineTo(nx, 13 + len * 0.55); ctx.lineTo(nx + 1.5, 13);
    ctx.closePath(); ctx.fill();
  }

  // --- extra hardware, drawn behind the core hull ---
  if (level >= 2) {
    // outboard cannon pods
    ctx.fillStyle = tier.trim;
    ctx.fillRect(-20, -2, 5, 15);
    ctx.fillRect(15, -2, 5, 15);
    ctx.fillStyle = tier.hull;
    ctx.fillRect(-19.5, -8, 4, 7);
    ctx.fillRect(15.5, -8, 4, 7);
  }
  if (level >= 3) {
    // swept-back wings
    ctx.fillStyle = tier.hull;
    ctx.beginPath();
    ctx.moveTo(-15, 2); ctx.lineTo(-27, 12); ctx.lineTo(-27, 16); ctx.lineTo(-13, 13);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(15, 2); ctx.lineTo(27, 12); ctx.lineTo(27, 16); ctx.lineTo(13, 13);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = tier.trim;
    ctx.fillRect(-27, 12, 5, 3);
    ctx.fillRect(22, 12, 5, 3);
  }
  if (level >= 4) {
    // orbiting energy rings
    for (let i = 0; i < 2; i++) {
      const a = t * 3 + i * Math.PI;
      const ox = Math.cos(a) * 24, oy = Math.sin(a) * 7 + 4;
      ctx.fillStyle = i === 0 ? "#ff5ec4" : "#5ad2ff";
      ctx.beginPath(); ctx.arc(ox, oy, 3.2, 0, Math.PI * 2); ctx.fill();
    }
    // forward prow
    ctx.fillStyle = tier.trim;
    ctx.beginPath();
    ctx.moveTo(0, -22); ctx.lineTo(4, -12); ctx.lineTo(-4, -12);
    ctx.closePath(); ctx.fill();
  }

  // --- core hull ---
  ctx.fillStyle = tier.hull;
  ctx.beginPath();
  ctx.moveTo(0, -14);
  ctx.lineTo(5, 2);
  ctx.lineTo(15, 8);
  ctx.lineTo(15, 13);
  ctx.lineTo(4, 13);
  ctx.lineTo(-4, 13);
  ctx.lineTo(-15, 13);
  ctx.lineTo(-15, 8);
  ctx.lineTo(-5, 2);
  ctx.closePath();
  ctx.fill();

  // cockpit + running lights
  ctx.fillStyle = tier.trim;
  ctx.fillRect(-2, -6, 4, 10);
  if (level >= 3) {
    ctx.fillRect(-9, 4, 3, 8);
    ctx.fillRect(6, 4, 3, 8);
  }
  ctx.fillStyle = Math.floor(t * 8) % 2 === 0 ? "#ff4d4d" : "#ffe08a";
  ctx.fillRect(-15, 8, 4, 5);
  ctx.fillRect(11, 8, 4, 5);
}

function drawPlayer(p) {
  if (!p.alive) return;
  if (p.invuln > 0 && Math.floor(p.invuln * 12) % 2 === 0) return;

  const tier = SHIP_TIERS[game.power - 1];
  ctx.save();
  ctx.translate(p.x, p.y);
  // brief pop when a level is gained
  const pop = p.levelPop > 0 ? 1 + p.levelPop * 0.5 : 1;
  ctx.scale(tier.scale * pop, tier.scale * pop);
  drawShipHull(game.power, game.timer);
  ctx.restore();
}

function drawEnemy(e) {
  const def = ENEMY_TYPES[e.type];
  const wob = Math.sin(e.anim) * 1.5;
  ctx.save();
  ctx.translate(e.x, e.y);
  if (e.diving) ctx.rotate(Math.sin(e.diveT * 3) * 0.25);

  const hw = def.w / 2, hh = def.h / 2;

  if (e.type === "boss") {
    ctx.fillStyle = e.hp < def.hp ? "#ff8a5a" : def.color;
    ctx.beginPath();
    ctx.moveTo(0, hh);
    ctx.lineTo(-hw, 0);
    ctx.lineTo(-hw + 4, -hh);
    ctx.lineTo(hw - 4, -hh);
    ctx.lineTo(hw, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = def.accent;
    ctx.fillRect(-hw + 2, -2 + wob, hw * 2 - 4, 5);
    ctx.fillStyle = "#fff";
    ctx.fillRect(-4, -hh + 3, 8, 4);
  } else if (e.type === "soldier") {
    ctx.fillStyle = def.color;
    ctx.beginPath();
    ctx.moveTo(0, hh);
    ctx.lineTo(-hw, -2);
    ctx.lineTo(-hw + 6, -hh);
    ctx.lineTo(hw - 6, -hh);
    ctx.lineTo(hw, -2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = def.accent;
    ctx.fillRect(-hw + 3, -hh + 4 + wob, 6, 6);
    ctx.fillRect(hw - 9, -hh + 4 + wob, 6, 6);
    ctx.fillStyle = "#fff";
    ctx.fillRect(-3, 0, 6, 4);
  } else {
    ctx.fillStyle = def.color;
    ctx.beginPath();
    ctx.moveTo(0, hh);
    ctx.lineTo(-hw, -hh + 6);
    ctx.lineTo(-hw + 8, -hh);
    ctx.lineTo(hw - 8, -hh);
    ctx.lineTo(hw, -hh + 6);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = def.accent;
    ctx.fillRect(-6, -3 + wob, 12, 5);
  }

  // wing lights
  ctx.fillStyle = Math.floor(game.timer * 6 + e.anim) % 2 === 0 ? "#fff" : def.accent;
  ctx.fillRect(-hw, hh - 5, 3, 3);
  ctx.fillRect(hw - 3, hh - 5, 3, 3);

  ctx.restore();
}

/* ------------------------------------------------------------------ */
/* 코코인 (power-up coin)                                              */
/* ------------------------------------------------------------------ */
function spawnCoin(x, y, vy) {
  coins.push({
    x: clamp(x, 20, W - 20), y: y,
    w: 22, h: 22,
    vx: rand(-25, 25),
    vy: vy || rand(70, 110),
    spin: Math.random() * Math.PI * 2,
    life: 14
  });
}

function updateCoins(dt) {
  // occasional free coin drifting in from the top
  game.coinTimer -= dt;
  if (game.coinTimer <= 0) {
    game.coinTimer = rand(9, 16);
    if (coins.length < 3) spawnCoin(rand(40, W - 40), -20, rand(60, 90));
  }

  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.spin += dt * 4.5;
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    if (c.x < 16 || c.x > W - 16) c.vx *= -1;
    c.x = clamp(c.x, 16, W - 16);
    c.life -= dt;

    if (c.y > H + 24 || c.life <= 0) { coins.splice(i, 1); continue; }

    if (player.alive && overlap(c, player)) {
      coins.splice(i, 1);
      collectCoin(c);
    }
  }
}

function collectCoin(c) {
  if (game.power < MAX_POWER) {
    game.power++;
    player.levelPop = 0.45;
    Sound.powerUp();
    const tier = SHIP_TIERS[game.power - 1];
    addFloatText(player.x, player.y - 40, "LV." + game.power + " " + tier.name, "#ffd35a");
    explode(player.x, player.y, tier.trim, 22, 0.8);
    game.shake = Math.max(game.shake, 5);
  } else {
    game.score += 1000;
    Sound.coin();
    addFloatText(c.x, c.y, "1000", "#ffd35a");
  }
  explode(c.x, c.y, "#ffd35a", 12, 0.7);
}

function drawCoin(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  // blink out as it is about to expire
  if (c.life < 3 && Math.floor(c.life * 8) % 2 === 0) { ctx.restore(); return; }

  const sq = Math.abs(Math.cos(c.spin));   // spinning-disc squash
  const r = 10;

  ctx.fillStyle = "rgba(255,211,90,0.22)";
  ctx.beginPath(); ctx.arc(0, 0, r + 5, 0, Math.PI * 2); ctx.fill();

  // rim
  ctx.fillStyle = "#a97a10";
  ctx.beginPath(); ctx.ellipse(0, 0, Math.max(1.6, r * sq), r, 0, 0, Math.PI * 2); ctx.fill();
  // face
  ctx.fillStyle = "#ffd35a";
  ctx.beginPath(); ctx.ellipse(0, 0, Math.max(1, r * sq * 0.76), r * 0.76, 0, 0, Math.PI * 2); ctx.fill();

  // "코" glyph, only while the face is turned toward us
  if (sq > 0.45) {
    ctx.globalAlpha = (sq - 0.45) / 0.55;
    ctx.fillStyle = "#7a5400";
    ctx.font = "bold 11px 'Malgun Gothic', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("코", 0, 1);
    ctx.globalAlpha = 1;
    ctx.textBaseline = "alphabetic";
  }
  // specular glint
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.fillRect(-r * sq * 0.4, -r * 0.55, Math.max(1, r * sq * 0.25), 3);

  ctx.restore();
}

/* ------------------------------------------------------------------ */
/* Update                                                              */
/* ------------------------------------------------------------------ */
function firePlayer() {
  const shots = SHIP_TIERS[game.power - 1].shots;
  const y = player.y - 16;
  const SPD = 620;

  if (shots === 1) {
    bullets.push({ x: player.x, y: y, w: 4, h: 12, vx: 0, vy: -SPD });
  } else if (shots === 2) {
    bullets.push({ x: player.x - 11, y: y, w: 4, h: 12, vx: 0, vy: -SPD });
    bullets.push({ x: player.x + 11, y: y, w: 4, h: 12, vx: 0, vy: -SPD });
  } else if (shots === 3) {
    bullets.push({ x: player.x,      y: y - 6, w: 5, h: 14, vx: 0, vy: -SPD - 60 });
    bullets.push({ x: player.x - 14, y: y, w: 4, h: 12, vx: 0, vy: -SPD });
    bullets.push({ x: player.x + 14, y: y, w: 4, h: 12, vx: 0, vy: -SPD });
  } else {
    bullets.push({ x: player.x - 6,  y: y - 6, w: 5, h: 14, vx: 0,    vy: -SPD - 80 });
    bullets.push({ x: player.x + 6,  y: y - 6, w: 5, h: 14, vx: 0,    vy: -SPD - 80 });
    bullets.push({ x: player.x - 18, y: y, w: 4, h: 12, vx: -110, vy: -SPD });
    bullets.push({ x: player.x + 18, y: y, w: 4, h: 12, vx: 110,  vy: -SPD });
  }
  Sound.shoot();
}

function updatePlayer(dt) {
  if (!player.alive) return;
  player.invuln = Math.max(0, player.invuln - dt);
  player.cooldown = Math.max(0, player.cooldown - dt);
  player.levelPop = Math.max(0, (player.levelPop || 0) - dt * 2.2);

  let dx = 0;
  if (keys["ArrowLeft"] || keys["KeyA"]) dx -= 1;
  if (keys["ArrowRight"] || keys["KeyD"]) dx += 1;
  player.x = clamp(player.x + dx * player.speed * dt, 20, W - 20);

  const shots = SHIP_TIERS[game.power - 1].shots;
  if ((keys["Space"] || keys["KeyZ"]) && player.cooldown <= 0 && bullets.length < shots * 3) {
    firePlayer();
    player.cooldown = 0.22 - (game.power - 1) * 0.015;
  }
}

function updateFormation(dt) {
  const total = enemies.length;
  // faster sway when few remain
  const rush = total > 0 ? 1 + (1 - total / Math.max(1, game.stageEnemyCount)) * 1.6 : 1;

  formation.offX += formation.dir * formation.speed * rush * dt;
  if (Math.abs(formation.offX) > formation.range) {
    formation.offX = clamp(formation.offX, -formation.range, formation.range);
    formation.dir *= -1;
    // step down every full sweep, but never far enough to sit on the player
    formation.dropped = Math.min(formation.dropped + 6, 180);
  }
}

function pickDiver() {
  const cands = enemies.filter(e => !e.entering && !e.diving);
  if (!cands.length) return null;
  return cands[Math.floor(Math.random() * cands.length)];
}

function updateEnemies(dt) {
  const maxDivers = 1 + Math.floor(game.stage / 2);
  formation.diveTimer -= dt;
  if (formation.diveTimer <= 0) {
    const divers = enemies.filter(e => e.diving).length;
    if (divers < maxDivers) {
      const e = pickDiver();
      if (e) {
        e.diving = true;
        e.diveT = 0;
        e.diveDir = player.x < e.x ? -1 : 1;
        e.diveStartX = e.x;
        e.diveStartY = e.y;
        e.diveTargetX = player.x;
      }
    }
    formation.diveTimer = Math.max(0.6, rand(2.2, 4.0) - game.stage * 0.12);
  }

  for (const e of enemies) {
    e.anim += dt * 4;

    if (e.entering) {
      e.enterDelay -= dt;
      if (e.enterDelay > 0) continue;
      const tx = e.homeX + formation.offX;
      const ty = e.homeY + formation.dropped;
      e.x += (tx - e.x) * Math.min(1, dt * 3.2);
      e.y += (ty - e.y) * Math.min(1, dt * 3.2);
      if (Math.abs(tx - e.x) < 2 && Math.abs(ty - e.y) < 2) {
        e.entering = false;
        e.x = tx; e.y = ty;
      }
      continue;
    }

    if (e.diving) {
      e.diveT += dt;
      const spd = (170 + game.stage * 18);
      e.y += spd * dt;
      // swooping S-curve toward the player's column
      const drift = (e.diveTargetX - e.diveStartX) * 0.6;
      e.x = e.diveStartX + Math.sin(e.diveT * 2.4) * 60 * e.diveDir + drift * Math.min(1, e.diveT / 1.6);
      e.x = clamp(e.x, 16, W - 16);

      if (e.y > H + 30) {
        // wrap around to the top and rejoin formation
        e.diving = false;
        e.entering = true;
        e.enterDelay = 0;
        e.y = -30;
        e.x = e.homeX + formation.offX;
      }
    } else {
      e.x = e.homeX + formation.offX;
      e.y = e.homeY + formation.dropped;
    }

    // shooting
    const def = ENEMY_TYPES[e.type];
    e.fireCd -= dt * (e.diving ? 2.2 : 1);
    if (e.fireCd <= 0) {
      e.fireCd = rand(2.2, 6.5) / (def.fireRate * (1 + game.stage * 0.12));
      if (player.alive && enemyBullets.length < 10 + game.stage) {
        const aimed = e.diving || Math.random() < 0.25 + game.stage * 0.04;
        let vx = 0, vy = 190 + game.stage * 12;
        if (aimed) {
          const dx = player.x - e.x, dy = player.y - e.y;
          const d = Math.hypot(dx, dy) || 1;
          const sp = 200 + game.stage * 14;
          vx = dx / d * sp; vy = dy / d * sp;
        }
        enemyBullets.push({ x: e.x, y: e.y + e.h / 2, w: 5, h: 10, vx: vx, vy: vy, type: e.type });
        Sound.enemyShoot();
      }
    }
  }
}

function killEnemy(e, idx) {
  const def = ENEMY_TYPES[e.type];
  const mult = e.diving ? 2 : 1;
  const gained = def.score * mult;
  game.score += gained;
  explode(e.x, e.y, def.color, e.type === "boss" ? 26 : 16, e.type === "boss" ? 1.3 : 1);
  addFloatText(e.x, e.y, (mult > 1 ? gained + "!" : String(gained)), def.color);
  enemies.splice(idx, 1);
  Sound.hit();
  game.shake = Math.max(game.shake, 4);

  // 코코인 drop — bosses and divers are the most generous
  let dropChance = e.type === "boss" ? 0.14 : (e.type === "soldier" ? 0.07 : 0.05);
  if (e.diving) dropChance += 0.06;
  if (game.power >= MAX_POWER) dropChance *= 0.4;
  if (coins.length < 3 && Math.random() < dropChance) spawnCoin(e.x, e.y, rand(80, 120));

  if (game.score >= game.nextExtra) {
    game.lives++;
    game.nextExtra += 30000;
    Sound.extraLife();
    addFloatText(player.x, player.y - 30, "1UP", "#7dff9b");
  }
}

function hitPlayer() {
  if (player.invuln > 0 || !player.alive) return;
  player.alive = false;
  game.lives--;
  explode(player.x, player.y, "#ffd9a0", 40, 1.5);
  explode(player.x, player.y, "#ff6a3a", 24, 1.1);
  Sound.playerDie();
  game.shake = 14;
  game.state = "dying";
  game.deathTimer = 1.6;

  // losing a life costs one ship level (never below Lv.1)
  if (game.power > 1) {
    game.power--;
    setTimeout(() => Sound.powerDown(), 700);
  }
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += (b.vx || 0) * dt;
    b.y += b.vy * dt;
    if (b.y < -20 || b.x < -20 || b.x > W + 20) { bullets.splice(i, 1); continue; }

    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (e.entering && e.enterDelay > 0) continue;
      if (overlap(b, e)) {
        bullets.splice(i, 1);
        e.hp--;
        if (e.hp <= 0) {
          killEnemy(e, j);
        } else {
          explode(e.x, e.y, "#ffffff", 6, 0.6);
          Sound.tone(440, 0.06, "square", 0.04, 300);
        }
        break;
      }
    }
  }

  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += (b.vx || 0) * dt;
    b.y += b.vy * dt;
    if (b.y > H + 20 || b.x < -20 || b.x > W + 20) { enemyBullets.splice(i, 1); continue; }
    if (player.alive && player.invuln <= 0 && overlap(b, player)) {
      enemyBullets.splice(i, 1);
      hitPlayer();
    }
  }
}

function checkCollisions() {
  if (!player.alive || player.invuln > 0) return;
  for (const e of enemies) {
    if (e.entering && e.enterDelay > 0) continue;
    if (overlap(e, player)) {
      explode(e.x, e.y, ENEMY_TYPES[e.type].color, 14, 1);
      const idx = enemies.indexOf(e);
      if (idx >= 0) enemies.splice(idx, 1);
      hitPlayer();
      return;
    }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (!p.text) { p.vx *= 0.96; p.vy *= 0.96; }
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.maxLife, 0, 1);
    if (p.text) {
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.font = "bold 13px Consolas, monospace";
      ctx.textAlign = "center";
      ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      ctx.globalAlpha = 1;
    }
  }
}

/* ------------------------------------------------------------------ */
/* HUD                                                                 */
/* ------------------------------------------------------------------ */
function drawShipIcon(x, y, scale) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.fillStyle = "#e8f4ff";
  ctx.beginPath();
  ctx.moveTo(0, -10);
  ctx.lineTo(4, 2);
  ctx.lineTo(11, 7);
  ctx.lineTo(-11, 7);
  ctx.lineTo(-4, 2);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = "#ff5c5c";
  ctx.font = "bold 14px Consolas, monospace";
  ctx.textAlign = "left";
  ctx.fillText("SCORE", 14, 22);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 18px Consolas, monospace";
  ctx.fillText(String(game.score).padStart(6, "0"), 14, 42);

  ctx.fillStyle = "#ff5c5c";
  ctx.font = "bold 14px Consolas, monospace";
  ctx.textAlign = "center";
  ctx.fillText("HI-SCORE", W / 2, 22);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 18px Consolas, monospace";
  ctx.fillText(String(Math.max(game.hiScore, game.score)).padStart(6, "0"), W / 2, 42);

  ctx.fillStyle = "#ff5c5c";
  ctx.font = "bold 14px Consolas, monospace";
  ctx.textAlign = "right";
  ctx.fillText("STAGE " + game.stage, W - 14, 22);

  // ship level + power meter
  const tier = SHIP_TIERS[game.power - 1];
  ctx.fillStyle = tier.trim;
  ctx.font = "bold 13px Consolas, monospace";
  ctx.textAlign = "right";
  ctx.fillText("LV." + game.power + " " + tier.name, W - 14, 42);
  for (let i = 0; i < MAX_POWER; i++) {
    const bx = W - 14 - (MAX_POWER - i) * 14;
    if (i < game.power) {
      ctx.fillStyle = tier.trim;
      ctx.fillRect(bx, 50, 10, 6);
    } else {
      ctx.strokeStyle = "rgba(160,175,220,0.45)";
      ctx.lineWidth = 1;
      ctx.strokeRect(bx + 0.5, 50.5, 9, 5);
    }
  }

  // lives
  for (let i = 0; i < Math.min(game.lives, 6); i++) {
    drawShipIcon(24 + i * 26, H - 16, 0.9);
  }
  if (game.lives > 6) {
    ctx.fillStyle = "#e8f4ff";
    ctx.font = "12px Consolas, monospace";
    ctx.textAlign = "left";
    ctx.fillText("x" + game.lives, 24 + 6 * 26, H - 11);
  }

  // stage flags
  ctx.textAlign = "right";
  for (let i = 0; i < Math.min(game.stage, 8); i++) {
    const fx = W - 20 - i * 18;
    ctx.fillStyle = "#ffd35a";
    ctx.fillRect(fx, H - 24, 12, 14);
    ctx.fillStyle = "#a97a10";
    ctx.fillRect(fx + 2, H - 22, 8, 5);
  }
}

function centerText(text, y, size, color) {
  ctx.fillStyle = color;
  ctx.font = "bold " + size + "px Consolas, monospace";
  ctx.textAlign = "center";
  ctx.fillText(text, W / 2, y);
}

/* ------------------------------------------------------------------ */
/* Screens                                                             */
/* ------------------------------------------------------------------ */
function drawTitle() {
  const t = game.timer;
  centerText("G A L A G A", 150, 52, "#5ad2ff");
  ctx.save();
  ctx.globalAlpha = 0.35;
  centerText("G A L A G A", 153, 52, "#ff5ec4");
  ctx.restore();

  centerText("- SCORE TABLE -", 210, 17, "#ffffff");
  const items = [
    { type: "boss",    label: "200 PTS" },
    { type: "soldier", label: "100 PTS" },
    { type: "grunt",   label: " 50 PTS" }
  ];
  items.forEach((it, i) => {
    const y = 245 + i * 38;
    drawEnemy({ type: it.type, x: W / 2 - 60, y: y, w: 0, h: 0, anim: t * 3 + i, hp: ENEMY_TYPES[it.type].hp, diving: false });
    ctx.fillStyle = "#ffd35a";
    ctx.font = "bold 17px Consolas, monospace";
    ctx.textAlign = "left";
    ctx.fillText(it.label, W / 2 - 20, y + 6);
  });

  // 코코인 + ship evolution
  centerText("- SHIP UPGRADE -", 380, 17, "#ffffff");
  drawCoin({ x: W / 2 - 118, y: 412, spin: t * 4.5, life: 99 });
  ctx.fillStyle = "#ffd35a";
  ctx.font = "bold 14px 'Malgun Gothic', Consolas, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("코코인 획득 → 총알 2배 & 함선 강화", W / 2 - 100, 417);

  SHIP_TIERS.forEach((tier, i) => {
    const sx = W / 2 - 108 + i * 72;
    ctx.save();
    ctx.translate(sx, 480);
    ctx.scale(tier.scale * 0.62, tier.scale * 0.62);
    drawShipHull(i + 1, t + i);
    ctx.restore();
    ctx.fillStyle = tier.trim;
    ctx.font = "bold 11px Consolas, monospace";
    ctx.textAlign = "center";
    ctx.fillText("LV." + (i + 1), sx, 522);
    ctx.fillStyle = "#6d78a8";
    ctx.font = "10px Consolas, monospace";
    ctx.fillText(tier.shots + " SHOT" + (tier.shots > 1 ? "S" : ""), sx, 536);
  });

  if (Math.floor(t * 2) % 2 === 0) {
    centerText("PRESS SPACE TO START", 600, 20, "#ffffff");
  }
  centerText("DIVING ENEMY = DOUBLE POINTS", 638, 13, "#6d78a8");
}

function drawGameOver() {
  centerText("GAME OVER", H / 2 - 40, 46, "#ff5c5c");
  centerText("SCORE  " + String(game.score).padStart(6, "0"), H / 2 + 10, 22, "#ffffff");
  centerText("STAGE  " + game.stage, H / 2 + 42, 18, "#ffd35a");
  if (game.score >= game.hiScore && game.score > 0) {
    centerText("NEW HI-SCORE!", H / 2 + 78, 18, "#5ad2ff");
  }
  if (Math.floor(game.timer * 2) % 2 === 0) {
    centerText("PRESS SPACE TO RESTART", H / 2 + 125, 18, "#ffffff");
  }
}

/* ------------------------------------------------------------------ */
/* Main loop                                                           */
/* ------------------------------------------------------------------ */
let last = performance.now();

function update(dt) {
  game.timer += dt;
  updateStars(dt);
  updateParticles(dt);
  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 30);

  if (game.state === "title") {
    if (keys["Space_pressed"]) { newGame(); }
    return;
  }

  if (game.state === "gameover") {
    if (keys["Space_pressed"]) { game.state = "title"; }
    return;
  }

  if (game.state === "dying") {
    game.deathTimer -= dt;
    // enemies keep moving during the death pause
    updateFormation(dt);
    updateEnemies(dt);
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const b = enemyBullets[i];
      b.x += (b.vx || 0) * dt; b.y += b.vy * dt;
      if (b.y > H + 20) enemyBullets.splice(i, 1);
    }
    if (game.deathTimer <= 0) {
      if (game.lives <= 0) {
        game.hiScore = Math.max(game.hiScore, game.score);
        game.state = "gameover";
        Sound.gameOver();
      } else {
        enemyBullets = [];
        resetPlayer();
        game.state = "playing";
      }
    }
    return;
  }

  if (game.state === "stageclear") {
    game.clearTimer -= dt;
    if (game.clearTimer <= 0) {
      game.stage++;
      buildStage(game.stage);
      resetPlayer();
      player.invuln = 1.5;
      game.state = "playing";
      Sound.stage();
    }
    return;
  }

  // playing
  if (game.paused) return;

  updatePlayer(dt);
  updateFormation(dt);
  updateEnemies(dt);
  updateBullets(dt);
  updateCoins(dt);
  checkCollisions();

  if (game.stageBanner > 0) game.stageBanner -= dt;

  if (enemies.length === 0) {
    game.state = "stageclear";
    game.clearTimer = 2.2;
    game.score += 500 * game.stage;   // stage clear bonus
    Sound.stage();
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#05060f";
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (game.shake > 0) {
    ctx.translate(rand(-game.shake, game.shake) * 0.4, rand(-game.shake, game.shake) * 0.4);
  }

  drawStars();

  if (game.state === "title") {
    drawTitle();
    drawParticles();
    ctx.restore();
    drawHUDTitle();
    return;
  }

  // bullets
  ctx.fillStyle = "#fff36b";
  for (const b of bullets) ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);

  for (const b of enemyBullets) {
    ctx.fillStyle = b.type === "boss" ? "#ffb0ff" : "#ff6b6b";
    ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.fillRect(b.x - 1, b.y - b.h / 2, 2, b.h);
  }

  for (const e of enemies) {
    if (e.entering && e.enterDelay > 0) continue;
    drawEnemy(e);
  }

  for (const c of coins) drawCoin(c);

  if (game.state !== "dying") drawPlayer(player);

  drawParticles();
  ctx.restore();

  drawHUD();

  if (game.state === "stageclear") {
    centerText("STAGE " + game.stage + " CLEAR!", H / 2 - 10, 34, "#5ad2ff");
    centerText("BONUS  " + (500 * game.stage), H / 2 + 28, 18, "#ffd35a");
  } else if (game.state === "gameover") {
    ctx.fillStyle = "rgba(5,6,15,0.72)";
    ctx.fillRect(0, 0, W, H);
    drawGameOver();
  } else if (game.paused) {
    ctx.fillStyle = "rgba(5,6,15,0.6)";
    ctx.fillRect(0, 0, W, H);
    centerText("PAUSED", H / 2, 36, "#ffffff");
    centerText("PRESS P TO RESUME", H / 2 + 36, 16, "#6d78a8");
  } else if (game.state === "playing" && game.stageBanner > 0 && game.stage >= 1) {
    if (Math.floor(game.stageBanner * 4) % 2 === 0) {
      centerText("STAGE " + game.stage, H / 2 - 60, 30, "#ffd35a");
    }
  }

  if (Sound.muted) {
    ctx.fillStyle = "#6d78a8";
    ctx.font = "12px Consolas, monospace";
    ctx.textAlign = "right";
    ctx.fillText("MUTED", W - 14, H - 40);
  }
}

function drawHUDTitle() {
  ctx.fillStyle = "#ff5c5c";
  ctx.font = "bold 14px Consolas, monospace";
  ctx.textAlign = "center";
  ctx.fillText("HI-SCORE", W / 2, 22);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 18px Consolas, monospace";
  ctx.fillText(String(game.hiScore).padStart(6, "0"), W / 2, 42);
}

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  update(dt);
  render();

  // clear one-shot key flags
  for (const k in keys) if (k.endsWith("_pressed")) keys[k] = false;

  requestAnimationFrame(loop);
}

/* ------------------------------------------------------------------ */
/* Boot                                                                */
/* ------------------------------------------------------------------ */
makeStars();
resetPlayer();
enemies = [];
bullets = [];
enemyBullets = [];
particles = [];
coins = [];
formation = { offX: 0, dir: 1, speed: 26, range: 34, dropped: 0, diveTimer: 3 };
game.stageEnemyCount = 1;
requestAnimationFrame(loop);

})();
</script>
</body>
